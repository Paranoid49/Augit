<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Augit</title>
  <link rel="stylesheet" href="src/mockup.css">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="src/current-find.js" defer></script>
  <!-- 图片预览的缩放/拖动/"适应区域"由共享模块提供；此前这里漏加载它，
       bindInteractions 里的 typeof 守卫于是静默跳过，图片文档只会平铺原始尺寸（第 259 轮实测 1920×1200 溢出画布）。 -->
  <script src="src/image-preview.js" defer></script>
  <script type="module" src="src/live-data.js"></script>
</head>
<body data-scene="main-project">
  <!--
    场景启动器：必须放在 <body> 起始处且为同步脚本。
    数据加载器（live-data.js）是 module，在文档解析完成后才执行；这里先落好场景与主题，
    保证 mockup.js 被动态插入后读取到的 body.dataset.scene 已经是目标场景。
  -->
  <script>
    (() => {
      const query = new URLSearchParams(window.location.search);
      const theme = query.get("theme") || "dark";
      document.documentElement.dataset.theme = theme;
      document.body.dataset.scene = query.get("scene") || "main-project";
    })();
  </script>
  <div id="app"></div>
</body>
</html>
