<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body, #terminal {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    html {
      background: transparent;
      --augit-scrollbar-thumb: transparent;
      --augit-scrollbar-thumb-hover: transparent;
    }

    body {
      background: transparent;
    }

    #terminal {
      background: transparent;
    }

    .xterm {
      padding: 11px 12px;
      box-sizing: border-box;
    }

    .xterm,
    .xterm .xterm-viewport,
    .xterm .xterm-screen {
      background: transparent !important;
    }

    .xterm .xterm-viewport {
      overflow-y: auto !important;
      scrollbar-color: var(--augit-scrollbar-thumb) transparent;
      scrollbar-width: thin;
    }

    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 10px;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-track {
      background: transparent;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background: var(--augit-scrollbar-thumb);
      background-clip: content-box;
      border: 2px solid transparent;
      border-radius: 8px;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: var(--augit-scrollbar-thumb-hover);
      background-clip: content-box;
    }
  </style>
</head>
<body>
  <div id="terminal" aria-label="Augit 内置终端"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
