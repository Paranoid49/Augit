name: Refresh release notes

# One-shot maintenance workflow: keep the already-published rc.14 body in sync with
# the repository's post-release verification record. It does not rebuild or upload assets.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh rc.14 release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0-rc.14 --notes-file docs/release-notes-1.0.0-rc.14.md --prerelease
