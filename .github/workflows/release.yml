name: Release

# 版本发布支持两种入口：
# - workflow_dispatch：手动指定版本，publish=true 时构建并发布；
# - push v* 标签：构建该标签并发布对应 Pre-release（发布说明由本次实际产物生成）。
# 发布资产必须来自同一次流水线构建，哈希写入 Release 正文和 SHA256SUMS.txt。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0-rc.2）'
        required: true
        default: '1.0.0-rc.2'
        type: string
      publish:
        description: '构建通过后创建或更新 GitHub Release'
        required: true
        default: false
        type: boolean
      prerelease:
        description: '标记为 GitHub Pre-release'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
          } else {
            $version = $env:REF_NAME
            if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "无效版本号：$version"
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=v$version`n")

      - name: Restore locked dependencies
        run: dotnet restore Augit.slnx --locked-mode

      - name: Restore packaging dependencies
        run: dotnet restore tools/packaging/Augit.Packaging.csproj --locked-mode

      - name: Build Release
        run: dotnet build Augit.slnx -c Release --no-restore

      - name: Configure Git identity for repository tests
        run: |
          git config --global user.name "Augit Tests"
          git config --global user.email "augit-tests@example.invalid"
          git config --global core.autocrlf false
          git config --global init.defaultBranch master

      - name: Run tests
        run: >-
          dotnet test Augit.slnx -c Release --no-build --no-restore
          --filter "FullyQualifiedName!~ConPtyTerminalSessionTests"

      - name: Verify UI assets
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/audit/verify-ui-assets.ps1

      - name: Build portable package and installer
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/release.ps1
          -Version "${{ steps.version.outputs.version }}"
          -OutputDirectory "artifacts/release-${{ steps.version.outputs.version }}"

      - name: Verify portable package content and versions
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "artifacts/release-$env:VERSION/Augit-$env:VERSION-win-x64-portable.zip"
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools/audit/verify-portable-package.ps1 `
            -PortableZip $zip `
            -OutDir "artifacts/release-verify-$env:VERSION" `
            -ExpectedVersion $env:VERSION `
            -SkipLaunch

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: augit-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/release-${{ steps.version.outputs.version }}/*.zip
            artifacts/release-${{ steps.version.outputs.version }}/*.exe
            artifacts/release-${{ steps.version.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Generate GitHub Release body
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $releaseDir = "artifacts/release-$env:VERSION"
          $notesPath = "docs/release-notes-$env:VERSION.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw "缺少发布说明：$notesPath" }
          $notes = Get-Content -LiteralPath $notesPath -Raw -Encoding utf8
          if ($notes -notmatch '<!-- RELEASE_ASSETS -->') { throw '发布说明缺少资产占位标记。' }
          $names = @(
            "Augit-$env:VERSION-win-x64-setup.exe",
            "Augit-$env:VERSION-win-x64-portable.zip",
            "SHA256SUMS.txt"
          )
          $rows = foreach ($name in $names) {
            $path = Join-Path $releaseDir $name
            if (-not (Test-Path -LiteralPath $path)) { throw "缺少发布资产：$path" }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $path).Length
            "| [$name](https://github.com/Paranoid49/Augit/releases/download/$env:TAG/$name) | $size B | ``$hash`` |"
          }
          $table = "| 文件 | 大小 | SHA-256 |`n| --- | ---: | --- |`n" + ($rows -join "`n")
          $body = $notes.Replace('<!-- RELEASE_ASSETS -->', $table)
          $bodyPath = Join-Path $releaseDir 'release-body.md'
          [System.IO.File]::WriteAllText($bodyPath, $body, [System.Text.UTF8Encoding]::new($false))
          Write-Host "release body: $bodyPath"

      - name: Create or update GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $releaseDir = "artifacts/release-$env:VERSION"
          $setup = "$releaseDir/Augit-$env:VERSION-win-x64-setup.exe"
          $zip = "$releaseDir/Augit-$env:VERSION-win-x64-portable.zip"
          $sums = "$releaseDir/SHA256SUMS.txt"
          foreach ($asset in @($setup, $zip, $sums)) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "缺少发布资产：$asset" }
          }

          $notesFile = Join-Path $releaseDir 'release-body.md'
          if (-not (Test-Path -LiteralPath $notesFile)) { throw "缺少发布正文：$notesFile" }
          # workflow_dispatch 未提供输入时按 Pre-release 处理；显式 false 用于正式版。
          $isPrerelease = $env:PRERELEASE -ne 'false'

          & gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:TAG $zip $setup $sums --clobber
            if ($LASTEXITCODE -ne 0) { throw '上传 Release 资产失败。' }
            if ($isPrerelease) {
              & gh release edit $env:TAG --title "Augit $env:VERSION" --notes-file $notesFile --prerelease
            } else {
              & gh release edit $env:TAG --title "Augit $env:VERSION" --notes-file $notesFile --prerelease=false
            }
            if ($LASTEXITCODE -ne 0) { throw '更新 Release 说明失败。' }
          } else {
            if ($isPrerelease) {
              & gh release create $env:TAG $zip $setup $sums --title "Augit $env:VERSION" --notes-file $notesFile --prerelease
            } else {
              & gh release create $env:TAG $zip $setup $sums --title "Augit $env:VERSION" --notes-file $notesFile --prerelease=false
            }
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败。' }
          }
