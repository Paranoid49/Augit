name: Release

# 版本发布使用手动 workflow_dispatch；发布门禁在 publish=true 时才执行。
# 推送 v* 标签只构建并保留 workflow artifact，不会自动覆盖已发布的 GitHub Release，
# 避免标签构建与人工验收产物之间出现哈希漂移。发布流程见 docs/releasing.md。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0-rc.2）'
        required: true
        default: '1.0.0-rc.2'
        type: string
      publish:
        description: '构建通过后创建或更新 GitHub Release'
        required: true
        default: false
        type: boolean
      prerelease:
        description: '标记为 GitHub Pre-release'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
          } else {
            $version = $env:REF_NAME
            if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "无效版本号：$version"
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=v$version`n")

      - name: Restore locked dependencies
        run: dotnet restore Augit.slnx --locked-mode

      - name: Restore packaging dependencies
        run: dotnet restore tools/packaging/Augit.Packaging.csproj --locked-mode

      - name: Build Release
        run: dotnet build Augit.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test Augit.slnx -c Release --no-build --no-restore

      - name: Verify UI assets
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/audit/verify-ui-assets.ps1

      - name: Build portable package and installer
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/release.ps1
          -Version "${{ steps.version.outputs.version }}"
          -OutputDirectory "artifacts/release-${{ steps.version.outputs.version }}"

      - name: Verify portable package content and versions
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "artifacts/release-$env:VERSION/Augit-$env:VERSION-win-x64-portable.zip"
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File tools/audit/verify-portable-package.ps1 `
            -PortableZip $zip `
            -OutDir "artifacts/release-verify-$env:VERSION" `
            -ExpectedVersion $env:VERSION `
            -SkipLaunch

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: augit-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/release-${{ steps.version.outputs.version }}/*.zip
            artifacts/release-${{ steps.version.outputs.version }}/*.exe
            artifacts/release-${{ steps.version.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $releaseDir = "artifacts/release-$env:VERSION"
          $assets = @(
            "$releaseDir/Augit-$env:VERSION-win-x64-portable.zip",
            "$releaseDir/Augit-$env:VERSION-win-x64-setup.exe",
            "$releaseDir/SHA256SUMS.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "缺少发布资产：$asset" }
          }

          $notesFile = "docs/release-notes-$env:VERSION.md"
          $notesArgs = if (Test-Path -LiteralPath $notesFile) { @('--notes-file', $notesFile) } else { @('--generate-notes') }
          if ($env:PRERELEASE -eq 'true') { $notesArgs += '--prerelease' }

          & gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw '上传 Release 资产失败。' }
            & gh release edit $env:TAG --title "Augit $env:VERSION" @notesArgs
            if ($LASTEXITCODE -ne 0) { throw '更新 Release 说明失败。' }
          } else {
            & gh release create $env:TAG @assets --title "Augit $env:VERSION" @notesArgs
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败。' }
          }
